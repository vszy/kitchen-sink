<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusViz — Enterprise Data Visualization Kitchen Sink (115+ Components)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #f1f5f9;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-primary: #4f46e5;
      --accent-secondary: #06b6d4;
      --grid-dot: rgba(148, 163, 184, 0.25);
    }
    [data-theme="dark"] {
      --bg-app: #090d16;
      --bg-sidebar: #0f172a;
      --bg-card: #131c31;
      --bg-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --accent-primary: #6366f1;
      --accent-secondary: #22d3ee;
      --grid-dot: rgba(71, 85, 105, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
      background-size: 20px 20px;
      transition: background-color 0.25s, color 0.25s;
    }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .viz-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .viz-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.12);
      border-color: #818cf8;
    }
    .viz-card.dark-panel {
      background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      border-color: #312e81;
    }
    .viz-card.soft-indigo { background: linear-gradient(180deg, rgba(238,242,255,0.85) 0%, var(--bg-card) 100%); }
    [data-theme="dark"] .viz-card.soft-indigo { background: linear-gradient(180deg, rgba(49,46,129,0.28) 0%, var(--bg-card) 100%); }
    .viz-card.soft-emerald { background: linear-gradient(180deg, rgba(236,253,245,0.85) 0%, var(--bg-card) 100%); }
    [data-theme="dark"] .viz-card.soft-emerald { background: linear-gradient(180deg, rgba(6,78,59,0.28) 0%, var(--bg-card) 100%); }
    .viz-card.soft-amber { background: linear-gradient(180deg, rgba(255,251,235,0.85) 0%, var(--bg-card) 100%); }
    [data-theme="dark"] .viz-card.soft-amber { background: linear-gradient(180deg, rgba(120,53,15,0.25) 0%, var(--bg-card) 100%); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 999px; }

    /* Animations */
    @keyframes stripeSlide {
      0% { background-position: 0 0; }
      100% { background-position: 28px 0; }
    }
    .progress-striped {
      background-image: linear-gradient(45deg, rgba(255,255,255,.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.25) 50%, rgba(255,255,255,.25) 75%, transparent 75%, transparent);
      background-size: 28px 28px;
      animation: stripeSlide 1s linear infinite;
    }
    @keyframes indeterminateBar {
      0% { left: -35%; right: 100%; }
      60% { left: 100%; right: -90%; }
      100% { left: 100%; right: -90%; }
    }
    .progress-indeterminate::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      background: linear-gradient(90deg, #6366f1, #ec4899, #06b6d4);
      animation: indeterminateBar 1.8s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }
    @keyframes pulseFlow {
      to { stroke-dashoffset: -24; }
    }
    .flow-animated {
      stroke-dasharray: 6 6;
      animation: pulseFlow 0.9s linear infinite;
    }
    body.no-anim * {
      animation: none !important;
      transition: none !important;
    }
    body.hide-labels .chart-data-label {
      opacity: 0 !important;
      pointer-events: none;
    }
    /* Global Floating Tooltip */
    #viz-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      border: 1px solid rgba(99, 102, 241, 0.5);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      transform: translate(-50%, -115%);
      transition: opacity 0.12s ease;
      opacity: 0;
      white-space: nowrap;
    }
    .svg-interactive:hover {
      filter: brightness(1.1);
      cursor: pointer;
    }
  </style>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white">
  <!-- Global Floating Tooltip -->
  <div id="viz-tooltip"></div>

  <!-- Top Control Bar -->
  <header class="sticky top-0 z-40 border-b backdrop-blur-md" style="background-color: color-mix(in srgb, var(--bg-sidebar) 88%, transparent); border-color: var(--border-color);">
    <div class="max-w-[1680px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-cyan-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13h4v8H3zm7-6h4v14h-4zm7-4h4v18h-4z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-lg tracking-tight">NexusViz <span class="text-indigo-500">Enterprise</span></h1>
            <span id="total-badge" class="px-2 py-0.5 text-xs font-bold rounded-full bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 border border-indigo-500/30">116 Components</span>
          </div>
          <p class="text-xs" style="color: var(--text-muted)">Zero-Dependency Native HTML / SVG / Canvas Visualization Encyclopedia</p>
        </div>

      <!-- Search & Global Controls -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" type="text" placeholder="Filter 116 visualizations..." class="pl-9 pr-3 py-1.5 text-xs rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-500 w-56" style="background-color: var(--bg-subtle); border-color: var(--border-color); color: var(--text-main);" />
        </div>

        <select id="timeframe-select" class="px-2.5 py-1.5 text-xs font-medium rounded-lg border cursor-pointer" style="background-color: var(--bg-subtle); border-color: var(--border-color); color: var(--text-main);">
          <option value="Q4">FY26 · Q4 Live</option>
          <option value="Q3">FY26 · Q3 Audit</option>
          <option value="YTD">FY26 · YTD Rollup</option>
        </select>

        <button id="btn-randomize" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 text-white hover:opacity-90 shadow-sm flex items-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          Randomize Data

        <button id="btn-reset" class="px-2.5 py-1.5 text-xs font-medium rounded-lg border hover:border-indigo-500 cursor-pointer" style="background-color: var(--bg-subtle); border-color: var(--border-color);">

          Labels: ON
        </button>

        <button id="btn-anim" class="px-2.5 py-1.5 text-xs font-medium rounded-lg border hover:border-indigo-500 cursor-pointer" style="background-color: var(--bg-subtle); border-color: var(--border-color);" title="Toggle Animations">
          Anim: ON
        </button>

        <button id="btn-theme" class="p-1.5 rounded-lg border hover:border-indigo-500 cursor-pointer" style="background-color: var(--bg-subtle); border-color: var(--border-color);" title="Switch Light/Dark Theme">
          <svg id="theme-icon" class="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-[1680px] mx-auto flex">
    <!-- Left Category Sidebar -->
    <aside class="hidden lg:block w-64 shrink-0 sticky top-[61px] h-[calc(100vh-61px)] overflow-y-auto border-r p-3" style="background-color: var(--bg-sidebar); border-color: var(--border-color);">
      <div class="text-[11px] font-bold uppercase tracking-wider px-2.5 mb-2" style="color: var(--text-muted)">16 Visualization Domains</div>
      <nav id="sidebar-nav" class="space-y-0.5 text-xs font-medium"></nav>
    </aside>

    <!-- Main Showcase Area -->
    <main id="showcase-root" class="flex-1 p-4 md:p-6 space-y-10 min-w-0"></main>
  </div>

<script>
/* ============================================================================
   NEXUSVIZ ENTERPRISE KITCHEN SINK ENGINE (100% VANILLA JS + SVG + CANVAS)
   ============================================================================ */

const PALETTE = {
  indigo: '#4f46e5', violet: '#7c3aed', cyan: '#06b6d4', emerald: '#10b981',
  amber: '#f59e0b', rose: '#f43f5e', blue: '#2563eb', orange: '#f97316',
  teal: '#14b8a6', fuchsia: '#d946ef', slate: '#64748b'
};
const SERIES_COLORS = ['#4f46e5', '#06b6d4', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6', '#ec4899'];

let state = {
  seed: 1,
  timeframe: 'Q4',
  anim: true,
  labels: true,
  search: '',
  progressOverride: 74,
  activeDataset: 'rev',
  hiddenSeries: {}
};

// Deterministic pseudo-random helper so Reset restores clean baseline
function getData(baseArr, jitter = 0.25) {
  const mult = state.timeframe === 'Q4' ? 1 : state.timeframe === 'Q3' ? 0.88 : 1.35;
  return baseArr.map((v, i) => {
    if (state.seed === 1) return +(v * mult).toFixed(1);
    const wave = Math.sin(state.seed * 13.7 + i * 2.3) * jitter;
    return +(v * mult * (1 + wave)).toFixed(1);
  });
}

// Tooltip Controller
const tooltipEl = document.getElementById('viz-tooltip');
function bindTooltips(container = document) {
  container.querySelectorAll('[data-tip]').forEach(el => {
    if (el.dataset.tipBound) return;
    el.dataset.tipBound = '1';
    el.classList.add('svg-interactive');
    el.addEventListener('mouseenter', e => {
      tooltipEl.innerHTML = el.getAttribute('data-tip');
      tooltipEl.style.opacity = '1';
    });
    el.addEventListener('mousemove', e => {
      tooltipEl.style.left = e.clientX + 'px';
      tooltipEl.style.top = e.clientY + 'px';
    });
    el.addEventListener('mouseleave', () => {
      tooltipEl.style.opacity = '0';
    });
  });
}

/* ============================================================================
   SVG & CANVAS CHART GENERATORS
   ============================================================================ */

function svgSparkline(data, color = '#4f46e5', fill = false, w = 120, h = 34) {
  const min = Math.min(...data) * 0.92;
  const max = Math.max(...data) * 1.05 || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / (max - min)) * (h - 6) - 3;
    return [x, y];
  });
  const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areaD = `${d} L${w},${h} L0,${h} Z`;
  const uid = 'sp_' + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-9 overflow-visible">
    ${fill ? `<defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${areaD}" fill="url(#${uid})"/>` : ''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="${color}" data-tip="Latest: ${data[data.length-1]}"/>
  </svg>`;
}

function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i === 0 ? i : i - 1];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
    const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
    const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
    const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
    const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function stepPath(pts) {
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    d += ` H ${pts[i][0].toFixed(1)} V ${pts[i][1].toFixed(1)}`;
  }
  return d;
}

function buildLineChart({ series, labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'], mode = 'linear', fill = false, gradient = false, highlightPeak = false, dualAxis = false }) {
  const w = 360, h = 155, padL = 28, padR = dualAxis ? 28 : 12, padT = 14, padB = 22;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const allVals = series.flatMap(s => s.data);
  const maxVal = Math.max(...allVals) * 1.12 || 10;
  const minVal = Math.min(0, Math.min(...allVals));

  let gridSvg = '';
  for (let i = 0; i <= 4; i++) {
    const y = padT + (plotH / 4) * i;
    const val = Math.round(maxVal - ((maxVal - minVal) / 4) * i);
    gridSvg += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="currentColor" stroke-opacity="0.1" stroke-dasharray="3 3"/>
      <text x="${padL - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="currentColor" opacity="0.55">${val}</text>`;
    if (dualAxis) {
      gridSvg += `<text x="${w - padR + 5}" y="${y + 3}" text-anchor="start" font-size="9" fill="#06b6d4">${Math.round(val * 1.4)}%</text>`;
    }
  }
  labels.forEach((lbl, i) => {
    const x = padL + (i / (labels.length - 1)) * plotW;
    gridSvg += `<text x="${x}" y="${h - 5}" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">${lbl}</text>`;
  });

  let defs = '';
  let linesSvg = '';
  series.forEach((s, idx) => {
    const sMax = dualAxis && idx === 1 ? Math.max(...s.data) * 1.15 : maxVal;
    const pts = s.data.map((v, i) => [
      padL + (i / (s.data.length - 1)) * plotW,
      padT + plotH - ((v - minVal) / (sMax - minVal)) * plotH
    ]);
    let pathD = mode === 'smooth' ? smoothPath(pts) : mode === 'step' ? stepPath(pts) : pts.map((p, i) => `${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const uid = 'lg_' + Math.random().toString(36).slice(2, 8);
    if (fill || gradient) {
      defs += `<linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity="${gradient ? '0.45' : '0.2'}"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0.01"/>
      </linearGradient>`;
      const areaD = `${pathD} L ${pts[pts.length-1][0].toFixed(1)},${padT+plotH} L ${pts[0][0].toFixed(1)},${padT+plotH} Z`;
      linesSvg += `<path d="${areaD}" fill="url(#${uid})"/>`;
    }
    linesSvg += `<path d="${pathD}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.4}" ${s.dashed ? 'stroke-dasharray="5 4"' : ''} stroke-linecap="round"/>`;

    const maxIdx = s.data.indexOf(Math.max(...s.data));
    pts.forEach((p, i) => {
      const isPeak = highlightPeak && i === maxIdx;
      linesSvg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${isPeak ? 5 : 3}" fill="${isPeak ? '#f43f5e' : s.color}" stroke="#fff" stroke-width="1.2" data-tip="<strong>${s.name}</strong> (${labels[i]}): ${s.data[i]}"/>`;
      if (isPeak) {
        linesSvg += `<text class="chart-data-label" x="${p[0]}" y="${p[1] - 9}" text-anchor="middle" font-size="9" font-weight="700" fill="#f43f5e">Peak ${s.data[i]}</text>`;
      }
    });
  });

  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-40 overflow-visible"><defs>${defs}</defs>${gridSvg}${linesSvg}</svg>`;
}

function buildAreaChart({ series, labels = ['W1','W2','W3','W4','W5','W6'], mode = 'smooth', stacked = false, percent = false }) {
  const w = 360, h = 150, padL = 28, padR = 10, padT = 12, padB = 22;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const len = labels.length;

  let computed = series.map(s => [...s.data]);
  if (percent) {
    for (let i = 0; i < len; i++) {
      const sum = series.reduce((acc, s) => acc + s.data[i], 0) || 1;
      series.forEach((s, si) => { computed[si][i] = +(s.data[i] / sum * 100).toFixed(1); });
    }
  } else if (stacked) {
    for (let i = 0; i < len; i++) {
      let acc = 0;
      series.forEach((s, si) => { acc += s.data[i]; computed[si][i] = acc; });
    }
  }
  const maxVal = percent ? 100 : Math.max(...computed.flat()) * 1.12;
  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const y = padT + (plotH / 4) * g;
    const lbl = Math.round(maxVal - (maxVal / 4) * g) + (percent ? '%' : '');
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="currentColor" stroke-opacity="0.1"/>
      <text x="${padL-4}" y="${y+3}" text-anchor="end" font-size="9" fill="currentColor" opacity="0.55">${lbl}</text>`;
  }
  labels.forEach((l, i) => {
    const x = padL + (i / (len - 1)) * plotW;
    grid += `<text x="${x}" y="${h-5}" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">${l}</text>`;
  });

  let defs = '', layers = '';
  for (let si = series.length - 1; si >= 0; si--) {
    const s = series[si];
    const pts = computed[si].map((v, i) => [
      padL + (i / (len - 1)) * plotW,
      padT + plotH - (v / maxVal) * plotH
    ]);
    const pathD = mode === 'smooth' ? smoothPath(pts) : pts.map((p, i) => `${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const uid = 'ar_' + Math.random().toString(36).slice(2, 8);
    defs += `<linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s.color}" stop-opacity="${stacked || percent ? '0.82' : '0.42'}"/><stop offset="100%" stop-color="${s.color}" stop-opacity="${stacked || percent ? '0.45' : '0.04'}"/></linearGradient>`;
    const areaD = `${pathD} L ${pts[pts.length-1][0].toFixed(1)},${padT+plotH} L ${pts[0][0].toFixed(1)},${padT+plotH} Z`;
    layers += `<path d="${areaD}" fill="url(#${uid})" data-tip="<strong>${s.name}</strong>"/>
      <path d="${pathD}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-40 overflow-visible"><defs>${defs}</defs>${grid}${layers}</svg>`;
}

function buildBarChart({ labels, datasets, horizontal = false, stacked = false, percent = false, rounded = false, gradient = false, diverging = false, waterfall = false, range = false }) {
  const w = 360, h = 160, padL = horizontal ? 62 : 28, padR = 12, padT = 14, padB = 22;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = labels.length;
  let bars = '', grid = '', defs = '';

  if (waterfall) {
    // Waterfall cumulative logic
    let running = 0;
    const steps = datasets[0].data.map((v, i) => {
      if (i === 0 || i === n - 1) {
        const start = 0, end = i === 0 ? v : running;
        if (i === 0) running = v;
        return { start, end, val: i === 0 ? v : running, isTotal: true };
      }
      const start = running;
      running += v;
      return { start, end: running, val: v, isTotal: false };
    });
    const maxV = Math.max(...steps.map(s => Math.max(s.start, s.end))) * 1.15;
    const slotW = plotW / n;
    steps.forEach((st, i) => {
      const yTop = padT + plotH - (Math.max(st.start, st.end) / maxV) * plotH;
      const yBot = padT + plotH - (Math.min(st.start, st.end) / maxV) * plotH;
      const barH = Math.max(3, yBot - yTop);
      const x = padL + i * slotW + slotW * 0.18;
      const bw = slotW * 0.64;
      const fill = st.isTotal ? '#4f46e5' : st.val >= 0 ? '#10b981' : '#f43f5e';
      bars += `<rect x="${x}" y="${yTop}" width="${bw}" height="${barH}" rx="4" fill="${fill}" data-tip="${labels[i]}: ${st.val > 0 && !st.isTotal ? '+' : ''}${st.val}"/>
        <text class="chart-data-label" x="${x + bw/2}" y="${yTop - 3}" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor">${st.val}</text>
        <text x="${x + bw/2}" y="${h - 5}" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.65">${labels[i]}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-40 overflow-visible">${bars}</svg>`;
  }

  if (diverging) {
    const midY = padT + plotH / 2;
    const maxAbs = Math.max(...datasets[0].data.map(Math.abs)) * 1.15;
    grid += `<line x1="${padL}" y1="${midY}" x2="${w - padR}" y2="${midY}" stroke="currentColor" stroke-opacity="0.35"/>`;
    const slotW = plotW / n;
    datasets[0].data.forEach((v, i) => {
      const bh = (Math.abs(v) / maxAbs) * (plotH / 2);
      const y = v >= 0 ? midY - bh : midY;
      const x = padL + i * slotW + slotW * 0.2;
      const bw = slotW * 0.6;
      const color = v >= 0 ? '#10b981' : '#f43f5e';
      bars += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${color}" data-tip="${labels[i]}: ${v > 0 ? '+' : ''}${v}%"/>
        <text x="${x + bw/2}" y="${h - 4}" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.65">${labels[i]}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-40 overflow-visible">${grid}${bars}</svg>`;
  }

  if (range) {
    // datasets[0] = min, datasets[1] = max
    const maxV = Math.max(...datasets[1].data) * 1.12;
    const slotW = plotW / n;
    labels.forEach((lbl, i) => {
      const lo = datasets[0].data[i], hi = datasets[1].data[i];
      const y1 = padT + plotH - (hi / maxV) * plotH;
      const y2 = padT + plotH - (lo / maxV) * plotH;
      const x = padL + i * slotW + slotW * 0.25;
      const bw = slotW * 0.5;
      bars += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(4, y2 - y1)}" rx="6" fill="#06b6d4" data-tip="${lbl}: ${lo} - ${hi}"/>
        <text class="chart-data-label" x="${x + bw/2}" y="${y1 - 3}" text-anchor="middle" font-size="8" fill="currentColor">${hi}</text>
        <text x="${x + bw/2}" y="${h - 4}" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.65">${lbl}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-40 overflow-visible">${bars}</svg>`;
  }

  if (horizontal) {
    const maxV = Math.max(...datasets[0].data) * 1.15;
    const rowH = plotH / n;
    labels.forEach((lbl, i) => {
      const v = datasets[0].data[i];
      const bw = (v / maxV) * plotW;
      const y = padT + i * rowH + rowH * 0.18;
      const bh = rowH * 0.64;
      const color = SERIES_COLORS[i % SERIES_COLORS.length];
      bars += `<text x="${padL - 6}" y="${y + bh * 0.72}" text-anchor="end" font-size="9.5" fill="currentColor" opacity="0.75">${lbl}</text>
        <rect x="${padL}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${color}" data-tip="${lbl}: ${v}"/>
        <text class="chart-data-label" x="${padL + bw + 5}" y="${y + bh * 0.72}" font-size="9" font-weight="600" fill="currentColor">${v}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-40 overflow-visible">${bars}</svg>`;
  }

  // Vertical (single, grouped, stacked, 100% stacked)
  let maxV = 100;
  if (!percent) {
    if (stacked) {
      maxV = Math.max(...labels.map((_, i) => datasets.reduce((s, d) => s + d.data[i], 0))) * 1.12;
    } else {
      maxV = Math.max(...datasets.flatMap(d => d.data)) * 1.15;
    }
  }
  for (let g = 0; g <= 4; g++) {
    const y = padT + (plotH / 4) * g;
    grid += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="currentColor" stroke-opacity="0.1"/>
      <text x="${padL - 4}" y="${y + 3}" text-anchor="end" font-size="8.5" fill="currentColor" opacity="0.55">${Math.round(maxV - (maxV/4)*g)}</text>`;
  }

  const slotW = plotW / n;
  labels.forEach((lbl, i) => {
    const slotX = padL + i * slotW;
    grid += `<text x="${slotX + slotW/2}" y="${h - 5}" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.65">${lbl}</text>`;

    if (stacked || percent) {
      const total = datasets.reduce((s, d) => s + d.data[i], 0) || 1;
      let accY = padT + plotH;
      datasets.forEach((ds, di) => {
        const val = percent ? (ds.data[i] / total) * 100 : ds.data[i];
        const bh = (val / maxV) * plotH;
        accY -= bh;
        bars += `<rect x="${slotX + slotW * 0.22}" y="${accY}" width="${slotW * 0.56}" height="${bh}" rx="${rounded ? 4 : 1}" fill="${ds.color}" data-tip="${lbl} · ${ds.name}: ${ds.data[i]}${percent ? ' ('+val.toFixed(0)+'%)' : ''}"/>`;
      });
    } else {
      const groupPad = slotW * 0.16;
      const bw = (slotW - groupPad * 2) / datasets.length;
      datasets.forEach((ds, di) => {
        const v = ds.data[i];
        const bh = (v / maxV) * plotH;
        const x = slotX + groupPad + di * bw;
        const y = padT + plotH - bh;
        let fill = ds.color || SERIES_COLORS[i % SERIES_COLORS.length];
        if (gradient) {
          const uid = 'bg_' + Math.random().toString(36).slice(2, 8);
          defs += `<linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>`;
          fill = `url(#${uid})`;
        }
        bars += `<rect x="${x + 1}" y="${y}" width="${Math.max(3, bw - 2)}" height="${bh}" rx="${rounded ? 6 : 2}" fill="${fill}" data-tip="${lbl} · ${ds.name}: ${v}"/>`;
        if (datasets.length === 1) {
          bars += `<text class="chart-data-label" x="${x + bw/2}" y="${y - 3}" text-anchor="middle" font-size="8.5" font-weight="600" fill="currentColor">${v}</text>`;
        }
      });
    }
  });

  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-40 overflow-visible"><defs>${defs}</defs>${grid}${bars}</svg>`;
}

function buildCircularChart({ segments, donut = false, semi = false, centerLabel = '', centerSub = '' }) {
  const w = 220, h = semi ? 125 : 165;
  const cx = w / 2, cy = semi ? 110 : h / 2;
  const r = semi ? 82 : 64;
  const innerR = donut || semi ? r * 0.62 : 0;
  const total = segments.reduce((a, b) => a + b.value, 0) || 1;
  let angle = semi ? -Math.PI : -Math.PI / 2;
  const maxSpan = semi ? Math.PI : Math.PI * 2;
  let paths = '';

  segments.forEach(seg => {
    const span = (seg.value / total) * maxSpan;
    const endAngle = angle + span;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    const largeArc = span > Math.PI ? 1 : 0;

    let d = '';
    if (innerR > 0) {
      const ix1 = cx + innerR * Math.cos(endAngle), iy1 = cy + innerR * Math.sin(endAngle);
      const ix2 = cx + innerR * Math.cos(angle), iy2 = cy + innerR * Math.sin(angle);
      d = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix2} ${iy2} Z`;
    } else {
      d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    }
    paths += `<path d="${d}" fill="${seg.color}" stroke="var(--bg-card)" stroke-width="2" data-tip="${seg.label}: ${seg.value} (${((seg.value/total)*100).toFixed(1)}%)"/>`;
    angle = endAngle;
  });

  if (centerLabel) {
    paths += `<text x="${cx}" y="${semi ? cy - 14 : cy - 2}" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor">${centerLabel}</text>
      <text x="${cx}" y="${semi ? cy : cy + 13}" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.6">${centerSub}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-40">${paths}</svg>`;
}

function buildGauge(pct, color = '#4f46e5', speedometer = false) {
  const w = 220, h = 130, cx = 110, cy = 108, r = 78;
  const startA = -Math.PI, endA = 0;
  const valA = startA + (pct / 100) * Math.PI;
  const nx = cx + (r - 12) * Math.cos(valA), ny = cy + (r - 12) * Math.sin(valA);
  const arcBg = `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`;
  const vx = cx + r * Math.cos(valA), vy = cy + r * Math.sin(valA);
  const arcFg = `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${vx} ${vy}`;

  let ticks = '';
  if (speedometer) {
    for (let i = 0; i <= 10; i++) {
      const a = -Math.PI + (i / 10) * Math.PI;
      const x1 = cx + (r + 4) * Math.cos(a), y1 = cy + (r + 4) * Math.sin(a);
      const x2 = cx + (r - 6) * Math.cos(a), y2 = cy + (r - 6) * Math.sin(a);
      ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>`;
    }
  }
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-36">
    <path d="${arcBg}" fill="none" stroke="currentColor" stroke-opacity="0.12" stroke-width="14" stroke-linecap="round"/>
    <path d="${arcFg}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" data-tip="Score: ${pct}%"/>
    ${ticks}
    ${speedometer ? `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>` : ''}
    <text x="${cx}" y="${speedometer ? cy - 22 : cy - 8}" text-anchor="middle" font-size="20" font-weight="800" fill="currentColor">${pct}%</text>
  </svg>`;
}

function updateInteractiveProgress(val) {
  state.progressOverride = val;

  const lbl = document.getElementById('prog-live-lbl');

function switchLineDs(ds) {

let canvasRaf = null;
let waveData = Array.from({length: 48}, (_, i) => 50 + Math.sin(i * 0.35) * 24);
function startLiveCanvasLine() {
  if (canvasRaf) cancelAnimationFrame(canvasRaf);
  const canvas = document.getElementById('live-canvas-line');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let tick = 0;

  function draw() {
    tick++;
    if (state.anim && tick % 4 === 0) {
      waveData.shift();
      waveData.push(50 + Math.sin(tick * 0.12) * 26 + (Math.random() - 0.5) * 14);
    }
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Subtle grid
    ctx.strokeStyle = 'rgba(148,163,184,0.15)';
    ctx.lineWidth = 1;
    for (let y = 25; y < h; y += 30) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Line & Gradient Fill
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(6, 182, 212, 0.42)');
    grad.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

    ctx.beginPath();
    waveData.forEach((v, i) => {
      const x = (i / (waveData.length - 1)) * w;
      const y = h - (v / 100) * (h - 20) - 10;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#06b6d4';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    canvasRaf = requestAnimationFrame(draw);
  }
  draw();
}
